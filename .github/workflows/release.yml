#
# Release build, triggered by pushing a version tag.
#
# Produces a tarball laid out the way README.md installs the binaries: the
# three artifacts pre-renamed to the dotted names LSF expects, so an
# administrator can unpack straight into $LSF_SERVERDIR.
#
#   git tag -a v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
#
# RUNNERS: see the note in ci.yml and .github/README.md.

name: Release

on:
  push:
    tags: ["v*"]
  # Allows a dry run against a branch: builds and packages, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustup show active-toolchain || true
          cargo --version

      # Runs before the build so a mismatched tag fails in seconds rather
      # than after a full release compile. Skipped for workflow_dispatch,
      # where GITHUB_REF_NAME is a branch and there is nothing to compare.
      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"

          # Every crate inherits version.workspace = true, so all five must
          # agree; read them from cargo metadata rather than parsing
          # Cargo.toml by hand.
          mapfile -t crate_versions < <(
            cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[].version' | sort -u
          )

          if [ "${#crate_versions[@]}" -ne 1 ]; then
            echo "::error::workspace crates disagree on their version: ${crate_versions[*]}" >&2
            exit 1
          fi
          crate_version="${crate_versions[0]}"

          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version ${crate_version}" >&2
            echo "Set version = \"${tag_version}\" in [workspace.package] in Cargo.toml," >&2
            echo "commit the Cargo.lock change, then move the tag." >&2
            exit 1
          fi

          echo "tag ${GITHUB_REF_NAME} matches crate version ${crate_version}"

      # A release must never ship something that fails its own tests.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked -p esub-qrmi -p jobstarter-qrmi -p elim-qpu

      # A Rust crate name cannot contain a dot, so the artifacts are built
      # under hyphenated names and renamed here -- the same rename README.md
      # documents for a manual install.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          stage="lsf-quantum-rust-${version}-linux-${arch}"

          mkdir -p "dist/${stage}"
          install -m 755 target/release/esub-qrmi       "dist/${stage}/esub.qrmi"
          install -m 755 target/release/jobstarter-qrmi "dist/${stage}/jobstarter.qrmi"
          install -m 755 target/release/elim-qpu        "dist/${stage}/elim.qpu"
          install -m 644 LICENSE                        "dist/${stage}/LICENSE"
          install -m 644 SECURITY-NOTES.md              "dist/${stage}/SECURITY-NOTES.md"

          cat > "dist/${stage}/INSTALL" <<EOF
          lsf-quantum-rust ${version} (linux-${arch})

          Install as the LSF administrator:

            sudo install -m 755 esub.qrmi       \$LSF_SERVERDIR/esub.qrmi
            sudo install -m 755 jobstarter.qrmi \$LSF_SERVERDIR/jobstarter.qrmi
            sudo install -m 755 elim.qpu        \$LSF_SERVERDIR/elim.qpu

          These binaries are already named as LSF expects; no rename is
          needed. See README.md in the repository for the LSF configuration
          that must accompany them (lsb.queues JOB_STARTER, the ELIM
          mapping, and \$LSF_ENVDIR/env.qpu with mode 0400).
          EOF

          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          ( cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )

          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          echo "--- contents ---"
          tar -tzf "dist/${stage}.tar.gz"

      # Kept even for a dry run, so workflow_dispatch still yields something
      # inspectable without creating a release.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.stage }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      # Uses the gh CLI rather than a marketplace action: third-party
      # actions are not mirrored on this GitHub Enterprise instance
      # (softprops/action-gh-release returns 404 here), whereas gh ships
      # with the runner images and is available offline.
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.tar.gz.sha256
