<text x="190" y="251.9" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827" font-weight="bold">bsub -a </tspan><tspan font-size="13.9" fill="#6B7280">“qrmi(file=.env,</tspan></text>
<text x="190" y="269.3" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#6B7280">qpu.qubits=156,…)”</tspan></text>
