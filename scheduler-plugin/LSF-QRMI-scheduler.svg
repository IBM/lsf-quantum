<text x="1220" y="395.7" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="19.4" fill="#FFFFFF" font-weight="bold">workload</tspan></text>
<text x="1220" y="420.0" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="19.4" fill="#FFFFFF" font-weight="bold">QRMI</tspan></text>
<line x1="1030" y1="295" x2="1030" y2="400" stroke="#9CA3AF" stroke-width="2.0" stroke-dasharray="9 6"/>
<line x1="1030" y1="400" x2="1145" y2="400" stroke="#9CA3AF" stroke-width="2.0" stroke-dasharray="9 6" marker-end="url(#ag)"/>
