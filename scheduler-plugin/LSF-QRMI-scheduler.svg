<text x="920" y="166" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="19.4" fill="#111827" font-weight="bold">Launch &amp; execute</tspan></text>
