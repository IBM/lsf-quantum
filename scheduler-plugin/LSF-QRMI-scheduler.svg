<rect id="mbatchd" x="495" y="215" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="560" y="263.4" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="20.8" fill="#111827" font-weight="bold">mbatchd</tspan></text>
<rect id="sbatchd" x="705" y="215" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="770" y="263.4" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="20.8" fill="#111827" font-weight="bold">sbatchd</tspan></text>
<rect id="jobstarter" x="885" y="215" width="160" height="80" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="965" y="261.8" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">jobstarter.qrmi</tspan></text>
<rect id="ibm" x="1145" y="215" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="1220" y="243.5" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">IBM Quantum</tspan></text>
<text x="1220" y="264.4" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">Platform</tspan></text>
<text x="1220" y="280.9" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280">QCS endpoint</tspan></text>
<line x1="75" y1="255" x2="95" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="285" y1="255" x2="315" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="445" y1="255" x2="495" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="625" y1="255" x2="705" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="835" y1="255" x2="885" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<line x1="1045" y1="255" x2="1145" y2="255" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<text x="1095" y="240" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280">acquire QPU</tspan></text>
</g>
<g id="scheduler-selection">
<rect id="schmod" x="470" y="355" width="280" height="90" rx="8" fill="#EDF5FF" stroke="#0F62FE" stroke-width="2.25"/>
<text x="610" y="386.5" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="18.1" fill="#111827" font-weight="bold">mbschd</tspan></text>
<text x="610" y="411.9" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="20.8" fill="#0F62FE" font-weight="bold">schmod_qrmi.so</tspan></text>
<text x="610" y="429.4" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280">scheduler plug-in (new)</tspan></text>
<rect id="elim" x="790" y="355" width="150" height="90" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
<text x="865" y="399.5" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="18.1" fill="#111827" font-weight="bold">elim.qpu</tspan></text>
<text x="865" y="416.3" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280">QPU load indices</tspan></text>
<line x1="545" y1="295" x2="545" y2="355" stroke="#0F62FE" stroke-width="2.25" marker-end="url(#ab)"/>
<line x1="575" y1="355" x2="575" y2="295" stroke="#0F62FE" stroke-width="2.25" marker-end="url(#ab)"/>
<line x1="790" y1="400" x2="750" y2="400" stroke="#0F62FE" stroke-width="2.0" marker-end="url(#ab)"/>
<text x="595" y="316" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#0F62FE" font-weight="bold" font-family="'Courier New', 'DejaVu Sans Mono', monospace">extsched_modifyJob</tspan></text>
<text x="595" y="330" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">adds rusage[qrmi_&lt;qpu&gt;=1]</tspan></text>
</g>
<g id="launch">
