<text x="38" y="112" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="18.1" fill="#6B7280">Submission, scheduler-side QPU selection (schmod_qrmi), and quantum-service execution</tspan></text>
