<text x="1215" y="340" text-anchor="end" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280">execution</tspan></text>
</g>
<rect id="panel-submission" x="35" y="485" width="400" height="185" rx="4" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.25"/>
<text x="50" y="514" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">Submission environment</tspan></text>
<text x="50" y="534" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#6B7280" font-weight="bold" font-family="'Courier New', 'DejaVu Sans Mono', monospace">$CWD/.env</tspan></text>
<text x="50" y="551" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="11.8" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">QRMI_IBM_QCS_IAM_APIKEY</tspan></text>
<text x="50" y="565" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="11.8" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">QRMI_IBM_QCS_SERVICE_CRN</tspan></text>
<text x="50" y="579" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="11.8" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">QRMI_IBM_QCS_{ENDPOINT,IAM_ENDPOINT,SESSION_MODE}</tspan></text>
<text x="50" y="616" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE" font-weight="bold">Request for the scheduler (new)</tspan></text>
<text x="50" y="631" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="11.8" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">-extsched "QRMI[selector=priority|</tspan></text>
<text x="50" y="645" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="11.8" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">   qpu=qubits=156]"</tspan></text>
<rect id="panel-selection" x="450" y="485" width="405" height="185" rx="4" fill="#EDF5FF" stroke="#0F62FE" stroke-width="1.75"/>
<text x="465" y="514" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">QPU selection in schmod_qrmi</tspan></text>
<text x="465" y="540" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE" font-weight="bold">1</tspan></text>
<text x="483" y="540" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Snapshot load indices: </tspan><tspan font-size="12.5" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">qubits, pending_jobs, …</tspan></text>
<text x="465" y="560" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE" font-weight="bold">2</tspan></text>
<text x="483" y="560" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Apply policy: </tspan><tspan font-size="12.5" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">basic | health | priority</tspan></text>
<text x="465" y="580" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE" font-weight="bold">3</tspan></text>
<text x="483" y="580" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Tag the job: </tspan><tspan font-size="12.5" fill="#0F62FE" font-family="'Courier New', 'DejaVu Sans Mono', monospace">rusage[qrmi_ibm_kingston=1]</tspan></text>
<text x="465" y="600" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE" font-weight="bold">4</tspan></text>
<text x="483" y="600" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Hold one cycle; release once tagged</tspan></text>
<text x="465" y="626" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280" font-style="italic">device=&lt;name&gt; jobs are tagged too, without consulting metrics.</tspan></text>
<rect id="panel-launch" x="870" y="485" width="425" height="185" rx="4" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.25"/>
<text x="885" y="514" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="16.7" fill="#111827" font-weight="bold">Environment propagation at launch</tspan></text>
<text x="885" y="540" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827" font-weight="bold">1</tspan></text>
<text x="903" y="540" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Read the QPU tag: </tspan><tspan font-size="12.5" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">bjobs -o effective_resreq</tspan></text>
<text x="885" y="560" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827" font-weight="bold">2</tspan></text>
<text x="903" y="560" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Bind alias: </tspan><tspan font-size="12.5" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">QRMI_IBM_QCS_*</tspan></text>
<text x="903" y="580" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#6B7280">→ </tspan><tspan font-size="12.5" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">ibm_kingston_QRMI_IBM_QCS_*</tspan></text>
<text x="885" y="600" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827" font-weight="bold">3</tspan></text>
<text x="903" y="600" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#111827">Acquire the QPU, record it with </tspan><tspan font-size="12.5" fill="#111827" font-family="'Courier New', 'DejaVu Sans Mono', monospace">bpost</tspan><tspan font-size="13.9" fill="#111827">, run</tspan></text>
<text x="885" y="628" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="12.5" fill="#6B7280" font-style="italic">No QRMI enumeration or metric queries at launch.</tspan></text>
<line x1="380" y1="295" x2="380" y2="485" stroke="#9CA3AF" stroke-width="2.0" stroke-dasharray="9 6" marker-end="url(#ag)"/>
<line x1="610" y1="445" x2="610" y2="485" stroke="#0F62FE" stroke-width="2.0" marker-end="url(#ab)"/>
<line x1="990" y1="295" x2="990" y2="485" stroke="#9CA3AF" stroke-width="2.0" stroke-dasharray="9 6" marker-end="url(#ag)"/>
<g id="legend">
<line x1="40" y1="697" x2="95" y2="697" stroke="#111827" stroke-width="2.0" marker-end="url(#an)"/>
<text x="100" y="701" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#6B7280">Control / execution flow</tspan></text>
<line x1="360" y1="697" x2="415" y2="697" stroke="#9CA3AF" stroke-width="2.0" stroke-dasharray="9 6" marker-end="url(#ag)"/>
<text x="420" y="701" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#6B7280">Environment propagation</tspan></text>
<line x1="655" y1="697" x2="710" y2="697" stroke="#0F62FE" stroke-width="2.0" marker-end="url(#ab)"/>
<text x="715" y="701" text-anchor="start" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.9" fill="#0F62FE">QPU selection (new)</tspan></text>
<text x="1295" y="691" text-anchor="end" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.2" fill="#111827" font-style="italic">The scheduler picks the QPU once and records it on the job;</tspan></text>
<text x="1295" y="706" text-anchor="end" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xml:space="preserve"><tspan font-size="13.2" fill="#111827" font-style="italic">the jobstarter no longer queries QRMI to choose.</tspan></text>
</g>
</svg>
