#
# cargo-deny configuration.
#
# Written alongside .cargo/audit.toml because the two tools do not share a
# format: an ignore in one has no effect on the other, and which one a given
# scanner uses is not always obvious. Keep the advisory lists in step.
#
# See SECURITY-NOTES.md for the analysis behind the ignores.

[advisories]
version = 2
yanked = "warn"

ignore = [
    # dotenv 0.15.0 -- unmaintained, no vulnerability. A direct dependency
    # of QRMI, not of this workspace: nothing in crates/ uses it, because
    # lsfq-core parses .env and env.qpu itself (see creds.rs). Removing it
    # is upstream's call.
    "RUSTSEC-2021-0141",

    # instant 0.1.13 -- unmaintained, no vulnerability. Transitive via
    # parking_lot 0.11 / wasm-timer, under reqwest-retry and the QRMI
    # sub-crates.
    "RUSTSEC-2024-0384",

    # ---------------------------------------------------------------------
    # See SECURITY-NOTES.md for the full reasoning.
    # ---------------------------------------------------------------------

    # crypto-bigint 0.5.5 -- timing variability in operations intended to be
    # constant-time. Reachable only through the S3 request-signing path:
    #   crypto-bigint <- elliptic-curve <- p256 <- ecdsa <- aws-sigv4
    # Nothing in crates/ calls the AWS SDK, so no S3 request is ever signed,
    # and a timing side channel needs repeated measurable operations.
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5

    # Unmaintained / unsound, no fix available through QRMI.
    "RUSTSEC-2026-0543", # chrono 0.4.45 (unmaintained), via QRMI sub-crates
    "RUSTSEC-2026-0441", # pin-utils (unmaintained), via aws-smithy-http
]

[licenses]
version = 2
# Apache-2.0 is this project's own licence; the rest are the permissive
# licences actually present in the dependency tree (checked against
# `cargo metadata --all-features`).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.9

# DELIBERATELY NOT ALLOWED: GPL-3.0-or-later.
#
# `rhexdump` (GPL-3.0-or-later) was a dependency of QRMI 0.26.0 and has been
# removed upstream; it is absent from QRMI 0.26.3. Keep GPL out of the allow
# list so a reintroduction fails this check rather than passing silently.
# See SECURITY-NOTES.md.
#
# `clarify` below records the one tree entry whose expression cargo-deny
# cannot parse: "Apache-2.0 / MIT" (fnv 1.0.7) uses the obsolete slash
# syntax for what is an OR.

[[licenses.clarify]]
crate = "fnv"
expression = "Apache-2.0 OR MIT"
license-files = []

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# QRMI is not published to crates.io, so it is a git dependency pinned to a
# tag. See crates/lsfq-core/Cargo.toml.
allow-git = ["https://github.com/qiskit-community/qrmi"]
