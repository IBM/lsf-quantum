#
# cargo-audit configuration.
#
# See SECURITY-NOTES.md for the full analysis behind the ignores below. The
# short version: these advisories reach this workspace only transitively,
# cannot be upgraded from here, and are not reachable at runtime by any of
# the three binaries.

[advisories]
ignore = [
    # --- Unmaintained crates (no known vulnerability). ---
    # dotenv 0.15.0: a direct dependency of QRMI, not of this workspace --
    # lsfq-core parses .env and env.qpu itself (see creds.rs).
    "RUSTSEC-2021-0141",
    # instant 0.1.13: transitive via parking_lot 0.11 / wasm-timer.
    "RUSTSEC-2024-0384",

    # --- Kept in step with deny.toml. ---
    # See SECURITY-NOTES.md.

    # Timing variability, reachable only via the S3 request-signing path
    # (aws-sigv4). Nothing in crates/ calls the AWS SDK, so no request is
    # ever signed.
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5

    # Unmaintained / unsound, no fix available through QRMI.
    "RUSTSEC-2026-0543", # chrono 0.4.45 (unmaintained), via QRMI sub-crates
    "RUSTSEC-2026-0441", # pin-utils (unmaintained), via aws-smithy-http
    "RUSTSEC-2026-0253", # lru 0.16.4 (LruCache::pop), via aws-sdk-s3 only
]
