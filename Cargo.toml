[workspace]
resolver = "2"
members = [
    "crates/qpu-select",
    "crates/lsfq-core",
    "crates/elim-qpu",
    "crates/jobstarter-qrmi",
    "crates/esub-qrmi",
]

# Two libraries and the three binaries that make up the LSF QPU plugins.

[workspace.package]
version = "0.1.0"
edition = "2021"
# Not a floor this workspace chose: the aws-smithy crates reached through
# QRMI (aws-sdk-s3 <- quantum-system-api <- qrmi) declare 1.94.1, and cargo
# refuses the build outright below that. See rust-toolchain.toml.
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/IBM/lsf-quantum"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

